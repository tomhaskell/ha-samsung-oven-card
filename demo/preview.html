<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samsung Oven Card - Visual Preview & Mock Harness</title>
    <style>
      :root {
        /* Home Assistant Theme Variables (Default Light) */
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #bdbdbd;
        --primary-color: #03a9f4;
        --accent-color: #ff9800;
        --orange-color: #ff9800;
        --amber-color: #ffc107;
        --blue-color: #2196f3;
        --red-color: #f44336;
        --green-color: #4caf50;
        --warning-color: #ff9800;
        --error-color: #db4437;
        --success-color: #0f9d58;

        /* Card container tokens matching Lovelace */
        --card-background-color: #ffffff;
        --ha-card-background: var(--card-background-color);
        --ha-card-border-radius: 12px;
        --ha-card-border-width: 1px;
        --ha-card-border-color: #e0e0e0;
        --ha-card-box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.05);
        --divider-color: rgba(0, 0, 0, 0.12);
        --secondary-background-color: #f5f5f5;

        /* Typography */
        --ha-font-size-l: 18px;
        --ha-font-size-m: 14px;
        --ha-font-size-s: 12px;
        --ha-line-height-expanded: 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      }

      body {
        background-color: #f0f2f5;
        color: var(--primary-text-color);
        margin: 0;
        padding: 32px 16px;
      }

      /* Home Assistant Default Dark Mode */
      body.dark-mode {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9e9e9e;
        --disabled-text-color: #616161;
        --card-background-color: #1c1c1c;
        --ha-card-background: var(--card-background-color);
        --ha-card-border-color: rgba(255, 255, 255, 0.12);
        --ha-card-box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3);
        --divider-color: rgba(255, 255, 255, 0.12);
        --secondary-background-color: #282828;
        background-color: #111111;
      }

      .header-controls {
        max-width: 1200px;
        margin: 0 auto 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .theme-toggle-btn {
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        border-radius: 8px;
        border: 1px solid var(--divider-color);
        background: var(--card-background-color);
        color: var(--primary-text-color);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--ha-card-box-shadow);
      }

      .grid-container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 24px;
        align-items: start;
      }

      .card-wrapper {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--secondary-text-color);
        padding-left: 4px;
      }

      /* Home Assistant Lovelace <ha-card> Component Styling */
      ha-card {
        display: flex;
        flex-direction: column;
        background: var(--ha-card-background, var(--card-background-color));
        border-radius: var(--ha-card-border-radius, 12px);
        border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color, var(--divider-color));
        box-shadow: var(--ha-card-box-shadow, none);
        box-sizing: border-box;
        overflow: hidden;
      }

      /* Native HA web component mock shims */
      ha-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        background: var(--secondary-background-color);
        color: var(--primary-text-color);
        gap: 8px;
      }
      ha-button[raised] {
        background: var(--orange-color);
        color: #fff;
      }
      ha-button.stop-btn {
        background: var(--red-color);
        color: #fff;
      }
      ha-button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="header-controls">
      <div>
        <h1 style="margin: 0 0 4px 0; font-size: 24px">Samsung Oven Card Preview</h1>
        <p style="margin: 0; color: var(--secondary-text-color); font-size: 14px">
          Accurate Lovelace simulation for documentation & README screenshots.
        </p>
      </div>
      <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()">🌙 Toggle Dark Mode</button>
    </div>

    <div class="grid-container">
      <!-- 1. Active Cooking (Single Cavity) -->
      <div class="card-wrapper" id="card-active-cooking-container">
        <div class="card-title">1. Active Cooking (Convection Mode, Warming)</div>
        <samsung-oven-card id="card-active-cooking"></samsung-oven-card>
      </div>

      <!-- 2. Dual-Zone Split Mode -->
      <div class="card-wrapper" id="card-dual-zone-container">
        <div class="card-title">2. Dual-Zone Split Mode (Upper & Lower)</div>
        <samsung-oven-card id="card-dual-zone"></samsung-oven-card>
      </div>

      <!-- 3. Expanded Cooking Controls -->
      <div class="card-wrapper" id="card-expanded-container">
        <div class="card-title">3. Expanded Controls & Staged Settings</div>
        <samsung-oven-card id="card-expanded"></samsung-oven-card>
      </div>

      <!-- 4. Microwave Mode -->
      <div class="card-wrapper" id="card-microwave-container">
        <div class="card-title">4. Microwave Mode (Wattage Readout)</div>
        <samsung-oven-card id="card-microwave"></samsung-oven-card>
      </div>

      <!-- 5. Idle / Ready State -->
      <div class="card-wrapper" id="card-idle-container">
        <div class="card-title">5. Idle / Standby State</div>
        <samsung-oven-card id="card-idle"></samsung-oven-card>
      </div>
    </div>

      class HaIconShim extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
        }
        static get observedAttributes() {
          return ["icon"];
        }
        attributeChangedCallback() {
          this.render();
        }
        connectedCallback() {
          this.render();
        }
        render() {
          const icon = this.getAttribute("icon") || "";
          const path = MDI_PATHS[icon] || "";
          this.shadowRoot.innerHTML = `
            <style>
              :host {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: var(--mdc-icon-size, 24px);
                height: var(--mdc-icon-size, 24px);
                line-height: var(--mdc-icon-size, 24px);
                fill: currentColor;
              }
              svg {
                width: 100%;
                height: 100%;
                pointer-events: none;
                display: block;
              }
            </style>
            <svg viewBox="0 0 24 24">
              <path d="${path}" />
            </svg>
          `;
        }
      }
      customElements.define("ha-icon", HaIconShim);

      function toggleTheme() {
        document.body.classList.toggle("dark-mode");
      }
    </script>

    <!-- Import card bundle -->
    <script type="module" src="../dist/samsung-oven-card.js"></script>

    <!-- Setup Mock Hass States -->
    <script type="module">
      function createMockHass({
        deviceId = "oven_main",
        deviceName = "Kitchen Oven",
        subdeviceId = null,
        subdeviceName = null,
        machineState = "ready",
        cookingMode = "convection",
        temperature = 180,
        setpoint = 180,
        progressPercent = 0,
        minutesRemaining = 0,
        smartControl = "on",
        childLock = "on",
        door = "off",
        lamp = "on",
        sound = "on",
        cavityState = "Single",
        subStates = {},
      } = {}) {
        const estFinish = minutesRemaining > 0 ? new Date(Date.now() + minutesRemaining * 60 * 1000).toISOString() : "";

        const devices = {
          [deviceId]: {
            id: deviceId,
            name: deviceName,
            manufacturer: "LocalThings",
            identifiers: [["localthings", deviceId]],
          },
        };

        if (subdeviceId) {
          devices[subdeviceId] = {
            id: subdeviceId,
            name: subdeviceName,
            via_device_id: deviceId,
            manufacturer: "LocalThings",
            identifiers: [["localthings", subdeviceId]],
          };
        }

        // Entities matching SUFFIXES from consts.js exactly
        const entities = {
          "sensor.oven_machine_state": {
            device_id: deviceId,
            entity_id: "sensor.oven_machine_state",
          },
          "sensor.oven_cooking_mode": {
            device_id: deviceId,
            entity_id: "sensor.oven_cooking_mode",
          },
          "sensor.oven_temperature": {
            device_id: deviceId,
            entity_id: "sensor.oven_temperature",
          },
          "number.oven_setpoint": {
            device_id: deviceId,
            entity_id: "number.oven_setpoint",
          },
          "sensor.oven_progress_percent": {
            device_id: deviceId,
            entity_id: "sensor.oven_progress_percent",
          },
          "sensor.oven_estimated_finish": {
            device_id: deviceId,
            entity_id: "sensor.oven_estimated_finish",
          },
          "sensor.oven_cavity_state": {
            device_id: deviceId,
            entity_id: "sensor.oven_cavity_state",
          },
          "binary_sensor.oven_smart_control": {
            device_id: deviceId,
            entity_id: "binary_sensor.oven_smart_control",
          },
          "binary_sensor.oven_child_lock": {
            device_id: deviceId,
            entity_id: "binary_sensor.oven_child_lock",
          },
          "binary_sensor.oven_door": {
            device_id: deviceId,
            entity_id: "binary_sensor.oven_door",
          },
          "switch.oven_lamp": {
            device_id: deviceId,
            entity_id: "switch.oven_lamp",
          },
          "switch.oven_sound": {
            device_id: deviceId,
            entity_id: "switch.oven_sound",
          },
          "number.oven_cook_time": {
            device_id: deviceId,
            entity_id: "number.oven_cook_time",
          },
          "button.oven_start_cooking": {
            device_id: deviceId,
            entity_id: "button.oven_start_cooking",
          },
          "button.oven_stop": {
            device_id: deviceId,
            entity_id: "button.oven_stop",
          },
          "binary_sensor.oven_running": {
            device_id: deviceId,
            entity_id: "binary_sensor.oven_running",
          },
        };

        if (subdeviceId) {
          entities["sensor.sub_machine_state"] = {
            device_id: subdeviceId,
            entity_id: "sensor.sub_machine_state",
          };
          entities["sensor.sub_cooking_mode"] = {
            device_id: subdeviceId,
            entity_id: "sensor.sub_cooking_mode",
          };
          entities["sensor.sub_temperature"] = {
            device_id: subdeviceId,
            entity_id: "sensor.sub_temperature",
          };
          entities["number.sub_setpoint"] = {
            device_id: subdeviceId,
            entity_id: "number.sub_setpoint",
          };
          entities["sensor.sub_progress_percent"] = {
            device_id: subdeviceId,
            entity_id: "sensor.sub_progress_percent",
          };
          entities["sensor.sub_estimated_finish"] = {
            device_id: subdeviceId,
            entity_id: "sensor.sub_estimated_finish",
          };
          entities["binary_sensor.sub_running"] = {
            device_id: subdeviceId,
            entity_id: "binary_sensor.sub_running",
          };
        }

        const states = {
          "sensor.oven_machine_state": { state: machineState },
          "sensor.oven_cooking_mode": {
            state: cookingMode,
            attributes: {
              options: [
                "convection",
                "Fan Conventional",
                "Large Grill",
                "air_fryer",
                "micro_wave",
                "keep_warm",
                ...(subdeviceId ? ["upper_convection", "upper_grill", "lower_convection"] : []),
              ],
            },
          },
          "sensor.oven_temperature": {
            state: String(temperature),
            attributes: { unit_of_measurement: "°C" },
          },
          "number.oven_setpoint": {
            state: String(setpoint),
            attributes: {
              unit_of_measurement: "°C",
              min: 40,
              max: 250,
              step: 5,
            },
          },
          "sensor.oven_progress_percent": { state: String(progressPercent) },
          "sensor.oven_estimated_finish": { state: estFinish },
          "sensor.oven_cavity_state": { state: cavityState },
          "binary_sensor.oven_smart_control": { state: smartControl },
          "binary_sensor.oven_child_lock": { state: childLock },
          "binary_sensor.oven_door": { state: door },
          "switch.oven_lamp": { state: lamp },
          "switch.oven_sound": { state: sound },
          "binary_sensor.oven_running": {
            state: machineState === "cooking" ? "on" : "off",
          },
          "number.oven_cook_time": {
            state: "45",
            attributes: {
              unit_of_measurement: "min",
              min: 1,
              max: 360,
              step: 1,
            },
          },
          "button.oven_start_cooking": { state: "idle" },
          "button.oven_stop": { state: "idle" },
          ...subStates,
        };

        return {
          devices,
          entities,
          states,
          callService: (domain, service, data) => {
            console.log("Mock HA callService:", domain, service, data);
            return Promise.resolve();
          },
          formatEntityState: (stateObj) => {
            if (!stateObj) return "";
            const s = stateObj.state || "";
            return s.charAt(0).toUpperCase() + s.slice(1);
          },
        };
      }

      window.addEventListener("DOMContentLoaded", () => {
        // 1. Active Cooking Card (Heating up, Convection)
        const cardActive = document.querySelector("#card-active-cooking");
        cardActive.setConfig({ device_id: "oven_1", title: "Kitchen Oven" });
        cardActive.hass = createMockHass({
          deviceId: "oven_1",
          deviceName: "Kitchen Oven",
          machineState: "cooking",
          cookingMode: "convection",
          temperature: 168,
          setpoint: 180,
          progressPercent: 62,
          minutesRemaining: 24,
          cavityState: "Cooking",
          lamp: "off",
        });

        // 2. Dual-Zone Split Mode Card
        const cardDual = document.querySelector("#card-dual-zone");
        cardDual.setConfig({ device_id: "oven_dual", title: "Dual Cook Oven" });
        cardDual.hass = createMockHass({
          deviceId: "oven_dual",
          deviceName: "Dual Cook Oven",
          subdeviceId: "oven_sub_lower",
          subdeviceName: "Lower Cavity",
          machineState: "cooking",
          cookingMode: "upper_convection",
          temperature: 195,
          setpoint: 200,
          progressPercent: 78,
          minutesRemaining: 18,
          cavityState: "Split",
          subStates: {
            "sensor.sub_machine_state": { state: "cooking" },
            "sensor.sub_cooking_mode": { state: "lower_convection" },
            "sensor.sub_temperature": {
              state: "160",
              attributes: { unit_of_measurement: "°C" },
            },
            "number.sub_setpoint": {
              state: "160",
              attributes: { unit_of_measurement: "°C" },
            },
            "sensor.sub_progress_percent": { state: "45" },
            "sensor.sub_estimated_finish": {
              state: new Date(Date.now() + 35 * 60 * 1000).toISOString(),
            },
            "binary_sensor.sub_running": { state: "on" },
          },
        });

        // 3. Expanded Controls Card
        const cardExpanded = document.querySelector("#card-expanded");
        cardExpanded.setConfig({
          device_id: "oven_exp",
          title: "Baking Controls",
          standard_temperatures: [160, 180, 200, 220],
          standard_times: [15, 30, 45, 60],
        });
        cardExpanded.hass = createMockHass({
          deviceId: "oven_exp",
          deviceName: "Baking Controls",
          machineState: "ready",
          cookingMode: "convection",
          temperature: 25,
          setpoint: 180,
          progressPercent: 0,
          cavityState: "Ready",
        });
        setTimeout(() => {
          cardExpanded.togglePanel("sensor.oven_machine_state");
        }, 150);

        // 4. Microwave Mode Card
        const cardMicro = document.querySelector("#card-microwave");
        cardMicro.setConfig({
          device_id: "oven_micro",
          title: "Microwave Oven",
        });
        cardMicro.hass = createMockHass({
          deviceId: "oven_micro",
          deviceName: "Microwave Oven",
          machineState: "cooking",
          cookingMode: "micro_wave",
          progressPercent: 50,
          minutesRemaining: 3,
